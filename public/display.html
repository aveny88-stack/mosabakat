<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة العرض (البروجكتر)</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background-color: #1a237e; color: white; padding: 30px; }
        .card { background: rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 15px; display: inline-block; width: 85%; }
        h1 { font-size: 36px; }
        h2 { font-size: 28px; color: #ffeb3b; }
        .q-image { max-width: 50%; height: 220px; object-fit: contain; border-radius: 10px; margin: 15px 0; }
        input, button { padding: 15px; font-size: 20px; border-radius: 8px; margin: 10px; }
        
        /* خيارات شاشة العرض */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .disp-btn { padding: 25px; font-size: 20px; color: white; border: none; border-radius: 10px; font-weight: bold; }
        .btn-0 { background-color: #e21b3c; }
        .btn-1 { background-color: #1368ce; }
        .btn-2 { background-color: #d89e00; }
        .btn-3 { background-color: #26890c; }
    </style>
</head>
<body>

    <div class="card" id="connectCard">
        <h1>شاشة العرض الفصلية 📺</h1>
        <input type="text" id="pinInput" placeholder="أدخل رمز PIN المسابقة...">
        <button onclick="connectDisplay()">ربط بالشاشة الرئيسية</button>
    </div>

    <div class="card" id="displayArea" style="display:none;">
        <h1 id="screenTitle">المسابقة التفاعلية</h1>
        <h2 id="screenQuestion">بانتظار انطلاق المسابقة...</h2>
        <div id="screenImage"></div>
        <div class="grid-container" id="screenOptions"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function connectDisplay() {
            const pin = document.getElementById('pinInput').value;
            socket.emit('registerDisplay', pin);
        }

        socket.on('displayRegisteredSuccess', () => {
            document.getElementById('connectCard').style.display = 'none';
            document.getElementById('displayArea').style.display = 'block';
        });

        socket.on('newQuestion', (data) => {
            document.getElementById('screenTitle').innerText = `السؤال (${data.questionNumber}/${data.totalQuestions})`;
            document.getElementById('screenQuestion').innerText = data.text;
            
            document.getElementById('screenImage').innerHTML = data.image ? `<img src="${data.image}" class="q-image">` : '';

            const container = document.getElementById('screenOptions');
            container.innerHTML = '';
            data.options.forEach((optText, index) => {
                const div = document.createElement('div');
                div.className = `disp-btn btn-${index}`;
                div.innerText = optText;
                container.appendChild(div);
            });
        });

        socket.on('gameOver', (players) => {
            let html = '<h1>🏆 أبطال المسابقة 🏆</h1><ol style="font-size:26px; text-align:right;">';
            players.slice(0, 3).forEach((p, idx) => {
                let medal = idx === 0 ? '🥇 المركز الأول' : idx === 1 ? '🥈 المركز الثاني' : '🥉 المركز الثالث';
                html += `<li>${medal}: <b>${p.name}</b> (${p.score} نقطة)</li>`;
            });
            html += '</ol>';
            document.getElementById('displayArea').innerHTML = html;
        });
    </script>
</body>
</html>
